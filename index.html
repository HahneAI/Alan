<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      viewport-fit=cover: renders edge-to-edge on all iPhones (Dynamic Island,
      notch, home indicator). Safe-area CSS vars then push content into safe zones.
      minimum-scale=1 prevents iOS auto-zoom on form inputs.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1, viewport-fit=cover" />

    <!-- PWA / standalone web app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Alan" />
    <!--
      black-translucent: status bar blends into the app chrome rather than
      appearing as an opaque bar. Works in both standalone and browser mode.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Theme color for browser chrome (matches top bar white) -->
    <meta name="theme-color" content="#ffffff" />

    <!-- iOS home screen icon (fallback SVG — replace with 180×180 PNG for best results) -->
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Web app manifest (generated by vite-plugin-pwa) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Alan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
